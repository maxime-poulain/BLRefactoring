name: CI

# Two triggers, one run. Which one fires depends on where the branch lives, and the job below
# resolves the case where both would — by verifying the other run rather than assuming it (ADR 0047).
on:
  push:
    # Agent branches as well as master, for the same reason the integration suite runs on them:
    # the GitHub App an agent acts through cannot dispatch a workflow, and until a pull request
    # exists nothing else runs. Work pushed by an agent was reaching review having been built by
    # nobody — including the client regeneration below.
    branches: [master, 'claude/**']
  pull_request:
    # Kept for one case that `push` cannot reach: a pull request from a fork. A push to somebody
    # else's clone fires nothing here, so without this a fork's contribution would arrive at review
    # having been built by nobody — the very problem the `push` trigger above was added to fix, for
    # the contributors this repository does not own.
    branches: [master]

# This workflow writes to the repository, so two runs on one branch can race: both regenerate, both
# push, and the loser fails with a non-fast-forward nobody caused. Push runs therefore queue rather
# than cancel. A superseded pull-request run is canceled instead, which is safe for the branches
# that reach this point: a `claude/**` one delegates its build and writes nothing at all, and a
# fork's is read-only by permission. A same-repo branch the `push` trigger does not name is the one
# that both builds and commits here, and it has no push run to race against.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # Thirty rather than twenty since this job also builds the three images (ADR 0065). They are
    # built without a layer cache, so each pays for its own restore and publish.
    timeout-minutes: 30

    # This job used to carry a job-level `if` that skipped it outright for a same-repo `claude/**`
    # pull request, on the ground that the push trigger had already built that commit. The ground
    # was never checked. A skipped job still posts its check, GitHub counts a skipped check as
    # passing, and the sentence "its commit was already built when it was pushed" was a claim about
    # a run this workflow never looked at. When that run is canceled without ever reaching a
    # runner — measured on this repository, `runner_id: 0` after fifteen minutes in the queue — the
    # pull request wears a green `Build & Test` for a build that did not happen. See ADR 0047.
    #
    # The optimization survives; only the assumption goes. The first step below decides whether
    # this run must build or may stand on one that already did, and in the second case it waits for
    # that run and adopts its verdict. Every step after it carries the same condition, which is
    # noisier than a job-level `if` and is the point: a job that always runs is a check that can
    # never be green for nothing.

    # `contents: write` is for one step: the workflow regenerates the HTTP client and commits it
    # when the API has changed. Nothing else here writes. `actions: read` is for the delegation
    # step, which asks the API what the push run concluded. Declared on the job rather than on the
    # workflow so a second job added later starts from nothing rather than from this.
    permissions:
      contents: write
      actions: read

    steps:
      # Build, or stand on a build that already happened — and never on the mere belief that one
      # did. Only a same-repo `claude/**` pull request delegates: a push run is the primary build,
      # a fork's pull request is the only build it will ever get, and a same-repo branch the `push`
      # trigger does not name gets no push run at all. That last case is why the delegation is
      # narrow: it was once written as "every same-repo pull request", and `feature/*` branches
      # merged built by nobody — #62 did exactly that.
      #
      # Waiting rather than reading once, because the two events start together: at the moment this
      # runs, the push run is normally still building. What is waited for is a conclusion, not a
      # duration, so the answer is the push run's own verdict rather than a guess about timing.
      - name: Was this commit already built?
        id: delegation
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DELEGATES: ${{ github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name == github.repository
            && startsWith(github.event.pull_request.head.ref, 'claude/') }}
        run: |
          set -euo pipefail

          if [ "$DELEGATES" != "true" ]; then
            echo "This run is the build for $GITHUB_SHA."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Waiting for the push run that builds $HEAD_SHA."

          # Fifteen minutes, under the job's twenty. A push run normally appears within seconds and
          # finishes in about two minutes; the wait exists for the day it does not, and ending it
          # red is the honest answer to "no build has concluded for this commit".
          for _ in $(seq 1 60); do
            verdict=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$HEAD_SHA&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"' 2>/dev/null || true)

            case "$verdict" in
              "completed success")
                echo "::notice::Built by the push run for $HEAD_SHA; not building it again."
                echo "build=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              "completed "*)
                echo "::error::The push run for $HEAD_SHA ended as '${verdict#completed }'." \
                     "This pull request has no successful build, and a skipped check would have" \
                     "said otherwise."
                exit 1
                ;;
            esac

            sleep 15
          done

          echo "::error::No push run reached a conclusion for $HEAD_SHA within fifteen minutes." \
               "Re-run this job once one has; it will adopt that verdict."
          exit 1

      # On a pull request, check out the head branch itself rather than the merge commit GitHub
      # prepares. The regeneration below has to be able to commit its result, and a merge commit is
      # not on any branch. Skipped for forks, where the token is read-only anyway.
      - uses: actions/checkout@v5
        if: steps.delegation.outputs.build == 'true'
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Setup .NET
        if: steps.delegation.outputs.build == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Restore is run three times per job — inside the generator script, by the build, and for the
      # pinned NSwag CLI — and every one of them reaches the network without this.
      - name: Cache NuGet packages
        if: steps.delegation.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '.config/dotnet-tools.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Before the build, deliberately. The client is regenerated first, so the build that follows
      # compiles the solution against the client the API actually implies — including whatever the
      # regeneration just broke. Running it afterwards would report a stale success and leave the
      # breakage for the next push to discover.
      - name: Regenerate the HTTP client
        if: steps.delegation.outputs.build == 'true'
        run: ./scripts/generate-clients.sh

      # The API is the source of truth: when a controller changes, the client follows, in the same
      # run, without anyone being asked. Consumers are expected to keep up — that is the trade this
      # repository chose, and it is why this step commits rather than fails. See ADR 0008.
      #
      # It runs on pull requests too, which it did not until a pull request spent an evening red for
      # it. The two events start together on the same commit: the push run regenerated and committed,
      # while the pull-request run — checked out before that commit existed — found the same
      # difference and failed on it. The comment that used to sit here assumed an ordering the
      # platform does not provide. Worse, the bot's commit is made with GITHUB_TOKEN, which triggers
      # no workflow, so nothing re-ran against the corrected tree and the check stayed red until a
      # human pushed something unrelated.
      #
      # Forks are excluded: `contents: write` is downgraded there, so the push would fail rather than
      # help. A fork's client is checked below instead.
      - name: Commit the regenerated client
        if: >-
          steps.delegation.outputs.build == 'true' &&
          (github.event_name == 'push' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          if git diff --quiet -- src/TrainingHub.GeneratedClients/; then
            echo "The client already matches the API."
            exit 0
          fi

          echo "::notice::The API changed; committing the regenerated client."
          git diff --stat -- src/TrainingHub.GeneratedClients/

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TrainingHub.GeneratedClients/
          git commit -m "Regenerate the HTTP client from the API" \
                     -m "Written by CI: a controller of the layered stack changed, so the client it implies changed with it."
          git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"

      # From a fork there is nowhere to push, so the same difference has to be a failure. It is the
      # only path left where a stale client can reach review.
      - name: Client is up to date
        if: >-
          steps.delegation.outputs.build == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if ! git diff --quiet -- src/TrainingHub.GeneratedClients/; then
            echo "::error::The committed HTTP client no longer matches the API." \
                 "Run ./scripts/generate-clients.sh and commit the result."
            git diff -- src/TrainingHub.GeneratedClients/
            exit 1
          fi

      # Everything is built, including the integration tests: a project that no
      # longer compiles must fail the pipeline even when its tests are not run.
      - name: Build
        if: steps.delegation.outputs.build == 'true'
        run: dotnet build --configuration Release

      # Unit tests only. The integration tests spin up a SQL Server through
      # Testcontainers, which makes them slow and infrastructure-dependent; they
      # are excluded by project name, so any future *.IntegrationTests project is
      # left out too.
      - name: Unit tests
        if: steps.delegation.outputs.build == 'true'
        run: >-
          dotnet test --no-build --configuration Release --verbosity normal
          --filter "FullyQualifiedName!~IntegrationTests"

      # The three images, built and thrown away — nothing is pushed anywhere, because what goes
      # wrong in a Dockerfile of this shape fails at build time or never. The one image this
      # repository had became unbuildable exactly once, when its restore stage stopped copying two
      # files it needs, and the README carried a warning about it for months instead. See ADR 0065.
      #
      # Steps of this job rather than a job of their own, for a reason ADR 0047 already settled: a
      # separate job would need a job-level `if` to honor the delegation above, and a job skipped
      # that way still posts a check GitHub reads as passing. `EveryImage_IsBuiltByThePipeline`
      # reads this step, so a fourth host cannot arrive with an image nothing builds.
      #
      # No layer cache and no third-party action. Every `uses:` in this repository is first-party,
      # and a cross-run Docker cache costs a builder action plus a cache backend to save a few
      # minutes on a job whose budget is twenty. Named here rather than left to be rediscovered.
      - name: Images
        if: steps.delegation.outputs.build == 'true'
        run: |
          set -euo pipefail
          for dockerfile in \
            src/DDD/Api/Dockerfile \
            src/DDDWithCqrs/Api/Dockerfile \
            src/Web/TrainingHub.Blazor/TrainingHub.Blazor/Dockerfile
          do
            echo "::group::$dockerfile"
            docker build --file "$dockerfile" .
            echo "::endgroup::"
          done
