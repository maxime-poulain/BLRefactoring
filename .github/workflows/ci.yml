name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# The workflow only reads the repository; GITHUB_TOKEN gets nothing more.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      # Everything is built, including the integration tests: a project that no
      # longer compiles must fail the pipeline even when its tests are not run.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Unit tests only. The integration tests spin up a SQL Server through
      # Testcontainers, which makes them slow and infrastructure-dependent; they
      # are excluded by project name, so any future *.IntegrationTests project is
      # left out too.
      - name: Unit tests
        run: >-
          dotnet test --no-build --configuration Release --verbosity normal
          --filter "FullyQualifiedName!~IntegrationTests"
